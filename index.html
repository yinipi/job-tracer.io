<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de candidatures de stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 🚨 OBLIGATOIRE : Les deux librairies externes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#FAF7EF; --paper2:#F2EEE2; --ink:#201C2E; --sub:#746C83; --line:#E4DECF;
  --brand:#0E7C6B; --brand-ink:#063F36;
  --slate:#6B7280; --slate-bg:#EDEEF1;
  --amber:#C6811C; --amber-bg:#FBEED9;
  --blue:#2E6AA8; --blue-bg:#E3EDF7;
  --green:#2E9552; --green-bg:#E2F3E6;
  --clay:#C85A41; --clay-bg:#FBE6DF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1A1721; --paper2:#211D2A; --ink:#EFEAF5; --sub:#A79FBA; --line:#38324A;
  --brand:#2FB39C; --brand-ink:#9FEADD;
  --slate-bg:#2A2A33; --amber-bg:#3A2C13; --blue-bg:#1D2C3D; --green-bg:#15301F; --clay-bg:#3A2019;
}}
:root[data-theme="dark"]{
  --paper:#1A1721; --paper2:#211D2A; --ink:#EFEAF5; --sub:#A79FBA; --line:#38324A;
  --brand:#2FB39C; --brand-ink:#9FEADD;
  --slate-bg:#2A2A33; --amber-bg:#3A2C13; --blue-bg:#1D2C3D; --green-bg:#15301F; --clay-bg:#3A2019;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{background:radial-gradient(900px 500px at 100% -10%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 60%), var(--paper);
  color:var(--ink); font-family:'Inter',ui-sans-serif,system-ui,sans-serif; min-height:100%;}
.serif{font-family:'Fraunces', Georgia, serif;}
header{padding:36px 28px 0; border-bottom:1px solid var(--line);}
.title-row{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:16px;}
h1{font-size:2.2rem; font-weight:650; font-style:italic; letter-spacing:-.3px; line-height:1.05;}
h1 span{color:var(--brand);}

.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn{ font-size:.9rem; font-weight:600; background:var(--brand); color:#fff; border:none; border-radius:999px; padding:11px 20px; cursor:pointer; white-space:nowrap; box-shadow:0 3px 0 var(--brand-ink); transition:transform .08s ease; display: inline-flex; align-items: center; gap: 6px; }
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--brand-ink);}
.btn-secondary { background: var(--paper2); color: var(--ink); box-shadow: 0 3px 0 var(--line); border: 1px solid var(--line); }
.btn-secondary:active { box-shadow: 0 1px 0 var(--line); }

.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.search-wrap{position:relative; flex:1; min-width:200px; max-width:340px;}
.search-wrap input{width:100%; padding:9px 12px 9px 32px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); font-size:.85rem; font-family:inherit;}
.search-wrap input:focus{outline:2px solid var(--brand); outline-offset:1px;}
.search-wrap::before{content:"🔍"; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:.8rem; opacity:.6;}
.theme-toggle{background:var(--paper2); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;}

.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
.stat-card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.stat-card .num{font-family:'Fraunces',serif; font-size:1.5rem; font-weight:650; line-height:1;}
.stat-card .lbl{font-size:.72rem; color:var(--sub); margin-top:4px; font-weight:600;}
.stat-card.goal{grid-column:span 2;}
.stat-card.goal .track{height:8px; background:var(--paper2); border-radius:999px; overflow:hidden; margin-top:8px;}
.stat-card.goal .fill{height:100%; background:var(--brand); width:0%; transition:width 1s cubic-bezier(.22,1,.36,1);}
.stat-card.goal .row{display:flex; justify-content:space-between; align-items:center;}
.stat-card.goal input{width:46px; padding:3px 6px; border:1px solid var(--line); border-radius:5px; background:var(--paper2); color:var(--ink); font-size:.76rem;}

.tabs{display:flex; gap:4px; margin-top:4px; overflow-x:auto;}
.tab{font-size:.82rem; font-weight:600; color:var(--sub); background:none; border:none; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:color .15s;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--brand); border-bottom-color:var(--brand);}

#toasts{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--ink); color:var(--paper); font-size:.84rem; padding:11px 16px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:12px; animation:toast-in .25s ease;}
.toast button{background:var(--brand); color:#fff; border:none; border-radius:7px; padding:5px 10px; font-size:.78rem; font-weight:600; cursor:pointer;}
@keyframes toast-in{from{transform:translateY(12px); opacity:0;} to{transform:translateY(0); opacity:1;}}

#confirmModal{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:90;}
#confirmModal.show{display:flex;}
#confirmModal .box{background:var(--paper); border-radius:14px; padding:22px; max-width:320px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3);}
#confirmModal .box p{font-size:.92rem; margin-bottom:16px;}
#confirmModal .box .btns{display:flex; gap:8px; justify-content:center;}
#confirmModal .box button{padding:8px 16px; border-radius:7px; font-size:.84rem; font-weight:600; cursor:pointer; border:1px solid var(--line);}
#confirmModal .box .yes{background:var(--clay); color:#fff; border-color:var(--clay);}

#form{display:none; border-bottom:1px solid var(--line); padding:22px 28px; background:var(--paper2);}
#form.open{display:block;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px;}
.grid label{font-size:.72rem; font-weight:600; color:var(--sub); display:block; margin-bottom:5px;}
.grid input, .grid select, .grid textarea{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font-family:inherit; font-size:.9rem; background:var(--paper); color:var(--ink);}
.grid input:focus, .grid select:focus, .grid textarea:focus{outline:2px solid var(--brand); outline-offset:1px;}
.grid textarea{resize:vertical; min-height:42px;}
.formrow-actions{margin-top:14px; display:flex; gap:8px;}
.formrow-actions button{font-size:.85rem; font-weight:600; padding:9px 16px; border-radius:7px; cursor:pointer; border:1px solid var(--line);}
.save{background:var(--brand); color:#fff; border-color:var(--brand);}
.cancel{background:transparent; color:var(--ink);}

main{padding:26px 28px 60px;}
.panel{display:none;}
.panel.active{display:block;}

#board-panel{overflow-x:auto;}
.board{display:flex; gap:18px; min-width:min-content;}
.col{width:270px; flex:0 0 270px; display: flex; flex-direction: column;}
.col-header{font-size:.72rem; font-weight:700; letter-spacing:.3px; color:var(--sub); padding-bottom:10px; margin-bottom:12px; border-bottom:2px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.col-header .n{font-size:.68rem; background:var(--paper2); border-radius:999px; padding:1px 8px; color:var(--ink);}

.col-content { flex: 1; min-height: 150px; border-radius: 12px; transition: background .2s, box-shadow .2s; padding:2px; }
.col-content.drag-over { background: var(--brand-bg,var(--paper2)); box-shadow: inset 0 0 0 2px var(--brand); }

.card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:0; margin-bottom:12px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); position:relative; cursor: grab; transition: transform .15s ease, box-shadow .15s ease; animation: card-in .35s ease backwards;}
.card:hover{ transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,.09); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.5; }
@keyframes card-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.card-top{height:6px;}
.statut-a-envoyer .card-top{background:var(--slate);}
.statut-envoyee .card-top{background:var(--amber);}
.statut-entretien .card-top{background:var(--blue);}
.statut-positive .card-top{background:var(--green);}
.statut-refusee .card-top{background:var(--clay);}
.card-body{padding:13px 14px;}
.card.statut-refusee{opacity:.68;}
.card h3{font-family:'Fraunces',serif; font-size:1.05rem; font-weight:600; margin-bottom:2px;}
.card .poste{font-size:.84rem; color:var(--sub); margin-bottom:8px;}
.theme-chip{display:inline-block; font-size:.66rem; font-weight:600; padding:3px 9px; border-radius:999px; margin-bottom:8px; margin-right:5px;}
.statut-a-envoyer .theme-chip{background:var(--slate-bg); color:var(--slate);}
.statut-envoyee .theme-chip{background:var(--amber-bg); color:var(--amber);}
.statut-entretien .theme-chip{background:var(--blue-bg); color:var(--blue);}
.statut-positive .theme-chip{background:var(--green-bg); color:var(--green);}
.statut-refusee .theme-chip{background:var(--clay-bg); color:var(--clay);}

.relance{font-size:.72rem; font-weight:600; margin-bottom:7px;}
.relance-past { color: var(--clay); }
.relance-future { color: var(--brand); }

.card .meta{font-size:.72rem; color:var(--sub); margin-bottom:7px;}
.card .notes, .card .appris{font-size:.82rem; color:var(--sub); margin-bottom:9px; white-space:pre-wrap; line-height:1.4;}
.card .appris{border-left:2px solid var(--brand); padding-left:8px;}
.card .row{display:flex; gap:6px; align-items:center;}
.card select{flex:1; font-size:.74rem; padding:6px 7px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink);}

.card .action-btn{background:none; border:none; color:var(--sub); cursor:pointer; font-size:1rem; padding:4px 6px; border-radius:5px;}
.card .action-btn:hover{background:var(--line);}
.card .action-btn.del:hover{color:var(--clay); background:var(--clay-bg);}
.card a.lien{font-size:.74rem; font-weight:600; color:var(--brand); display:inline-block; margin-bottom:9px;}
.empty{font-size:.8rem; color:var(--sub); padding:12px 0; font-style:italic;}

.list-item{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;}
.list-item .date-badge{font-weight:700; color:var(--brand); font-size:.85rem; min-width:90px;}

.theme-stat{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
.theme-stat h3{font-family:'Fraunces',serif; font-size:1rem; margin-bottom:8px;}
.theme-stat .track{height:8px; background:var(--paper2); border-radius:999px; overflow:hidden; margin:6px 0;}
.theme-stat .fill{height:100%; background:var(--brand);}
.theme-stat .figs{font-size:.76rem; color:var(--sub);}

table.compare{width:100%; border-collapse:collapse; font-size:.85rem;}
table.compare th, table.compare td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top;}
table.compare th{background:var(--paper2); font-size:.74rem; color:var(--sub); font-weight:700;}

.city-group{margin-bottom:16px;}
.city-group h3{font-family:'Fraunces',serif; font-size:1.05rem; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.city-group .chips{display:flex; flex-wrap:wrap; gap:8px;}
.city-chip{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:.82rem;}
.city-chip b{font-weight:600;}

#celebrate{position:fixed; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; z-index:50;}
#celebrate.show{display:flex;}
#celebrate .msg{background:var(--ink); color:var(--paper); font-family:'Fraunces',serif; font-size:1.2rem; font-style:italic; padding:16px 26px; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:pop .4s ease;}
.confetti{position:absolute; font-size:1.3rem; top:-5%; animation:fall 1.8s ease-in forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg); opacity:.2;}}
@keyframes pop{0%{transform:scale(.7); opacity:0;}100%{transform:scale(1); opacity:1;}}
</style>
</head>
<body>

<div id="celebrate"><div class="msg" id="celebrateMsg"></div></div>
<div id="toasts"></div>
<div id="confirmModal"><div class="box"><p id="confirmMsg"></p><div class="btns">
  <button class="cancel" id="confirmNo">Annuler</button><button class="yes" id="confirmYes">Supprimer</button>
</div></div></div>

<header>
  <div class="title-row">
    <h1 class="serif">Suivi de <span>candidatures</span></h1>
    <div class="header-actions">
      <label class="btn btn-secondary">
        📂 Importer
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </label>
      <button class="btn btn-secondary" id="exportBtn">💾 Sauvegarder</button>
      <button class="btn" id="openForm">+ Nouvelle candidature</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><input id="searchInput" placeholder="Rechercher une entreprise, un thème, une ville..."></div>
    <button class="theme-toggle" id="themeToggle" title="Basculer le thème clair/sombre">🌙</button>
  </div>
  <div class="stat-row" id="statRow"></div>
  <div class="tabs">
    <button class="tab active" data-tab="board">Tableau</button>
    <button class="tab" data-tab="calendar">Calendrier</button>
    <button class="tab" data-tab="stats">Statistiques</button>
    <button class="tab" data-tab="compare">Comparatif offres</button>
    <button class="tab" data-tab="cities">Par ville</button>
  </div>
</header>

<div id="form">
  <div class="grid">
    <div><label>Entreprise</label><input id="f-entreprise" placeholder="Ex. Thales"></div>
    <div><label>Thème / intitulé du stage</label><input id="f-theme" placeholder="Ex. Conception FPGA"></div>
    <div><label>Poste</label><input id="f-poste" placeholder="Ex. Stage ingénieur M2"></div>
    <div><label>Ville</label><input id="f-ville" placeholder="Ex. Toulouse"></div>
    <div><label>Date d'envoi</label><input id="f-date" type="date"></div>
    <div><label>Date de relance ⏰</label><input id="f-relance" type="date"></div>
    <div><label>Date d'entretien</label><input id="f-dateEntretien" type="date"></div>
    <div><label>Statut</label>
      <select id="f-statut">
        <option value="a-envoyer">À envoyer</option>
        <option value="envoyee" selected>Envoyée</option>
        <option value="entretien">Entretien</option>
        <option value="positive">Réponse positive</option>
        <option value="refusee">Refusée</option>
      </select>
    </div>
    <div><label>Contact (RH/Manager)</label><input id="f-contact" placeholder="Nom, email..."></div>
    <div><label>Lien annonce</label><input id="f-lien" placeholder="https://..."></div>
    <div><label>Durée</label><input id="f-duree" placeholder="Ex. 6 mois"></div>
    <div><label>Rémunération</label><input id="f-remuneration" placeholder="Ex. 1200€/mois"></div>
    <div style="grid-column:1/-1"><label>Missions</label><textarea id="f-missions" placeholder="Résumé des missions proposées"></textarea></div>
    <div style="grid-column:1/-1"><label>Notes & Retours d'entretiens</label><textarea id="f-notes" placeholder="Impressions, questions posées..."></textarea></div>
    <div style="grid-column:1/-1"><label>Ce que j'ai appris</label><textarea id="f-appris" placeholder="À retenir pour la suite, même en cas de refus"></textarea></div>
  </div>
  <div class="formrow-actions">
    <button class="save" id="saveBtn">Enregistrer</button>
    <button class="cancel" id="cancelBtn">Annuler</button>
  </div>
</div>

<main>
  <div class="panel active" id="board-panel"><div class="board" id="board"></div></div>
  <div class="panel" id="calendar-panel"></div>
  <div class="panel" id="stats-panel"></div>
  <div class="panel" id="compare-panel"></div>
  <div class="panel" id="cities-panel"></div>
</main>

<script>
const STATUTS = [
  {key:'a-envoyer', label:'À envoyer',        color:'var(--slate)'},
  {key:'envoyee',   label:'Envoyée',          color:'var(--amber)'},
  {key:'entretien', label:'Entretien',        color:'var(--blue)'},
  {key:'positive',  label:'Réponse positive', color:'var(--green)'},
  {key:'refusee',   label:'Refusée',          color:'var(--clay)'}
];
const SEED_DATA = [
  { "id": "lxz1a1", "entreprise": "Schneider Electric", "theme": "Hardware / Conception PCB", "poste": "Stage - Conception et caractérisation d'un PCB", "ville": "Eybens", "date": "2026-10-06", "relance": "2026-10-20", "dateEntretien": "", "statut": "envoyee", "contact": "Équipe Recrutement Innovation", "lien": "https://careers.se.com/jobs/134370", "duree": "5 à 6 mois", "remuneration": "", "missions": "Conception électronique haute vitesse d'un System on Module, modélisation de l'intégrité du signal et caractérisation par mesures labo.", "notes": "Candidature envoyée avec le CV 'Vert'. Forte mise en avant des compétences KiCad et des mesures physiques à l'IRCICA.", "appris": "" },
  { "id": "lxz1b2", "entreprise": "Airbus Defence and Space", "theme": "Automatisation / Spatial", "poste": "Stage - Modèles de test pour calculateurs Satellite", "ville": "Toulouse", "date": "2026-10-06", "relance": "2026-10-20", "dateEntretien": "", "statut": "envoyee", "contact": "", "lien": "https://ag.wd3.myworkdayjobs.com/en-US/Airbus/...JR10440950", "duree": "4 à 6 mois", "remuneration": "", "missions": "Création d'environnements de test pour simuler le comportement du satellite et valider le calculateur embarqué.", "notes": "Focus sur l'automatisation de bancs de test en Python (stage IRCICA) et l'analyse matérielle.", "appris": "" }
];

let data = [];
let goal = 20;
let editingId = null; 
let searchTerm = '';
let statChart = null;

// --- DÉMARRAGE ROBUSTE : On dessine d'abord l'interface ---
function loadDataLocal() {
  try {
    const raw = localStorage.getItem('candidatures');
    data = raw ? JSON.parse(raw) : SEED_DATA;
    goal = parseInt(localStorage.getItem('candidature_goal')) || 20;
  } catch(e) {
    data = SEED_DATA;
  }
  renderAll(); // <--- L'écran ne sera plus jamais vide grâce à cette ligne
}

// Lancement immédiat
loadDataLocal();

// --- CONNEXION SUPABASE EN ARRIÈRE-PLAN ---
// Tu peux remplacer TON_URL_ICI et TA_CLE_API_ICI. 
// Même si tu te trompes, le site fonctionnera quand même !
const supabaseUrl = 'TON_URL_ICI'; 
const supabaseKey = 'TA_CLE_API_ICI'; 
let supabase = null;

if (supabaseUrl !== 'TON_URL_ICI' && supabaseKey !== 'TA_CLE_API_ICI') {
  try {
    supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    syncCloud();
  } catch(e) { console.warn("Supabase désactivé ou erreur d'initialisation."); }
}

async function syncCloud() {
  if (!supabase) return;
  try {
    const { data: dbData, error } = await supabase.from('candidatures').select('*');
    if (dbData && !error && dbData.length > 0) {
      data = dbData;
      persistLocal();
      renderAll(); // Met à jour l'interface avec les données du Cloud
    }
  } catch(err) { console.warn("Mode hors-ligne actif."); }
}

function persistLocal(){
  try{
    localStorage.setItem('candidatures', JSON.stringify(data));
    localStorage.setItem('candidature_goal', String(goal));
  }catch(e){}
}

async function persist(){
  persistLocal();
  if (supabase && data.length > 0) {
    try { await supabase.from('candidatures').upsert(data); } catch(err) {}
  }
}

async function deleteCandidature(id) {
  data = data.filter(d => d.id !== id);
  persistLocal();
  renderAll();
  if (supabase) {
    try { await supabase.from('candidatures').delete().eq('id', id); } catch(err) {}
  }
}

function esc(s){ if(!s) return ''; return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function daysSince(dateStr){ if(!dateStr) return null; const d = new Date(dateStr); const diff = (Date.now()-d.getTime())/86400000; return Math.floor(diff); }

function matchesSearch(c){
  if(!searchTerm) return true;
  const hay = [c.entreprise, c.theme, c.ville, c.poste].join(' ').toLowerCase();
  return hay.includes(searchTerm);
}
function visibleData(){ return data.filter(matchesSearch); }

function toast(message, actionLabel, actionFn, duration=5000){
  const box = document.createElement('div');
  box.className = 'toast';
  box.innerHTML = `<span>${message}</span>`;
  if(actionLabel){
    const btn = document.createElement('button');
    btn.textContent = actionLabel;
    btn.addEventListener('click', ()=>{ actionFn(); box.remove(); });
    box.appendChild(btn);
  }
  document.getElementById('toasts').appendChild(box);
  setTimeout(()=>box.remove(), duration);
}

function showConfirm(message, onYes){
  const modal = document.getElementById('confirmModal');
  document.getElementById('confirmMsg').textContent = message;
  modal.classList.add('show');
  const yes = document.getElementById('confirmYes');
  const no = document.getElementById('confirmNo');
  const cleanup = ()=>{ modal.classList.remove('show'); yes.onclick=null; no.onclick=null; };
  yes.onclick = ()=>{ cleanup(); onYes(); };
  no.onclick = cleanup;
}

function applyTheme(mode){
  if(mode==='dark'){ document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeToggle').textContent='☀️'; }
  else if(mode==='light'){ document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').textContent='🌙'; }
  else { document.documentElement.removeAttribute('data-theme'); document.getElementById('themeToggle').textContent='🌓'; }
}
let themeMode = localStorage.getItem('theme_mode') || 'auto';
applyTheme(themeMode);
document.getElementById('themeToggle').addEventListener('click', ()=>{
  themeMode = themeMode==='dark' ? 'light' : themeMode==='light' ? 'auto' : 'dark';
  localStorage.setItem('theme_mode', themeMode);
  applyTheme(themeMode);
});
document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value.trim().toLowerCase();
  renderBoard(); renderCalendar(); renderCompare(); renderCities();
});

function getRelanceHtml(dateStr) {
  if(!dateStr) return '';
  const today = new Date();
  today.setHours(0,0,0,0);
  const relanceDate = new Date(dateStr);
  const isPast = relanceDate < today;
  const isToday = relanceDate.getTime() === today.getTime();
  let cssClass = isPast ? 'relance-past' : 'relance-future';
  let text = isPast ? '⚠️ Relance en retard : ' : (isToday ? '🔔 À relancer aujourd\'hui' : '⏰ Relance prévue le : ');
  return `<div class="relance ${cssClass}">${text} ${isToday ? '' : dateStr}</div>`;
}

function renderStatRow(){
  const sent = data.filter(d=>d.statut!=='a-envoyer').length;
  const interview = data.filter(d=>['entretien','positive'].includes(d.statut)).length;
  const positive = data.filter(d=>d.statut==='positive').length;
  const pct = (a,b)=> b>0 ? Math.round(a/b*100)+'%' : '—';
  document.getElementById('statRow').innerHTML = `
    <div class="stat-card"><div class="num">${sent}</div><div class="lbl">Envoyées</div></div>
    <div class="stat-card"><div class="num">${interview}</div><div class="lbl">Entretiens (${pct(interview,sent)})</div></div>
    <div class="stat-card"><div class="num">${positive}</div><div class="lbl">Offres (${pct(positive,interview)})</div></div>
    <div class="stat-card goal">
      <div class="row"><span class="lbl">Objectif</span><input type="number" id="goalInput" min="1" value="${goal}"></div>
      <div class="num" style="font-size:1.1rem;">${sent} / ${goal} envoyées</div>
      <div class="track"><div class="fill" id="goalFill" style="width:0%"></div></div>
    </div>`;
  requestAnimationFrame(()=>{
    const fill = document.getElementById('goalFill');
    if(fill) fill.style.width = Math.min(100,(sent/goal)*100)+'%';
  });
  document.getElementById('goalInput').addEventListener('change', e=>{
    goal = Math.max(1, parseInt(e.target.value)||20);
    persist(); renderStatRow();
  });
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  
  STATUTS.forEach(s=>{
    const col = document.createElement('div'); col.className='col';
    const items = visibleData().filter(d=>d.statut===s.key);
    
    col.innerHTML = `
      <div class="col-header">${s.label}<span class="n">${items.length}</span></div>
      <div class="col-content" data-statut="${s.key}">
        ${items.length === 0 ? `<div class="empty">Rien ici pour l'instant</div>` : ''}
      </div>`;
    
    const colContent = col.querySelector('.col-content');
    colContent.addEventListener('dragover', e => { e.preventDefault(); colContent.classList.add('drag-over'); });
    colContent.addEventListener('dragleave', e => { colContent.classList.remove('drag-over'); });
    colContent.addEventListener('drop', e => {
      e.preventDefault(); colContent.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const item = data.find(d => d.id === id);
      if(item && item.statut !== s.key) {
        const wasPositive = item.statut==='positive';
        item.statut = s.key;
        persist(); renderAll();
        if(!wasPositive && item.statut==='positive') celebrate(item.entreprise);
      }
    });

    items.forEach(c=>{
      const card = document.createElement('div');
      card.className = 'card statut-'+c.statut;
      card.draggable = true;
      card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.id); setTimeout(() => card.classList.add('dragging'), 0); });
      card.addEventListener('dragend', () => { card.classList.remove('dragging'); });

      card.innerHTML = `
        <div class="card-top"></div>
        <div class="card-body">
          <h3>${esc(c.entreprise)||'(sans nom)'}</h3>
          <div class="poste">${esc(c.poste)||''}${c.ville?' · '+esc(c.ville):''}</div>
          ${c.theme?`<span class="theme-chip">${esc(c.theme)}</span>`:''}
          <div class="meta">${c.date?'Envoyée le '+c.date:''}${c.dateEntretien?' · Entretien '+c.dateEntretien:''}${c.contact?' · '+esc(c.contact):''}</div>
          ${getRelanceHtml(c.relance)}
          ${c.notes?`<div class="notes">${esc(c.notes)}</div>`:''}
          ${c.appris?`<div class="appris">💡 ${esc(c.appris)}</div>`:''}
          ${c.lien?`<div><a class="lien" href="${esc(c.lien)}" target="_blank" rel="noopener">Voir l'annonce →</a></div>`:''}
          <div class="row">
            <select data-id="${c.id}" class="moveSelect">
              ${STATUTS.map(st=>`<option value="${st.key}" ${st.key===c.statut?'selected':''}>${st.label}</option>`).join('')}
            </select>
            <button class="action-btn edit" data-id="${c.id}" title="Modifier">✏️</button>
            <button class="action-btn del" data-id="${c.id}" title="Supprimer">✕</button>
          </div>
        </div>`;
      colContent.appendChild(card);
    });
    board.appendChild(col);
  });
  
  document.querySelectorAll('.moveSelect').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const id = e.target.dataset.id;
      const item = data.find(d=>d.id===id);
      if(item){
        const wasPositive = item.statut==='positive';
        item.statut = e.target.value;
        persist(); renderAll();
        if(!wasPositive && item.statut==='positive') celebrate(item.entreprise);
      }
    });
  });
  
  document.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      showConfirm("Supprimer cette candidature ?", ()=>{ deleteCandidature(id); toast("Candidature supprimée ✓"); });
    });
  });

  document.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const item = data.find(d=>d.id===id);
      if(item) {
        editingId = item.id;
        document.getElementById('f-entreprise').value = item.entreprise || '';
        document.getElementById('f-theme').value = item.theme || '';
        document.getElementById('f-poste').value = item.poste || '';
        document.getElementById('f-ville').value = item.ville || '';
        document.getElementById('f-date').value = item.date || '';
        document.getElementById('f-relance').value = item.relance || '';
        document.getElementById('f-dateEntretien').value = item.dateEntretien || '';
        document.getElementById('f-statut').value = item.statut || 'envoyee';
        document.getElementById('f-contact').value = item.contact || '';
        document.getElementById('f-lien').value = item.lien || '';
        document.getElementById('f-duree').value = item.duree || '';
        document.getElementById('f-remuneration').value = item.remuneration || '';
        document.getElementById('f-missions').value = item.missions || '';
        document.getElementById('f-notes').value = item.notes || '';
        document.getElementById('f-appris').value = item.appris || '';
        
        document.getElementById('form').classList.add('open');
        window.scrollTo(0, 0);
      }
    });
  });
}

function renderCalendar(){
  const panel = document.getElementById('calendar-panel');
  const withDate = visibleData().filter(d=>d.dateEntretien).sort((a,b)=>a.dateEntretien.localeCompare(b.dateEntretien));
  const withoutDate = visibleData().filter(d=>d.statut==='entretien' && !d.dateEntretien);
  let html = '<h2 class="serif" style="font-size:1.2rem;margin-bottom:14px;">Entretiens à venir</h2>';
  if(withDate.length===0) html += '<div class="empty">Aucun entretien planifié pour l\'instant.</div>';
  withDate.forEach(c=>{
    html += `<div class="list-item"><div><div class="date-badge">${c.dateEntretien}</div></div>
      <div style="flex:1;"><b>${esc(c.entreprise)}</b> — ${esc(c.poste)||''}${c.ville?' · '+esc(c.ville):''}${c.theme?'<br><span class="theme-chip" style="background:var(--blue-bg);color:var(--blue);">'+esc(c.theme)+'</span>':''}</div></div>`;
  });
  if(withoutDate.length>0){
    html += '<h2 class="serif" style="font-size:1.05rem;margin:18px 0 10px;">En entretien, sans date précisée</h2>';
    withoutDate.forEach(c=>{ html += `<div class="list-item"><div>${esc(c.entreprise)} — ${esc(c.poste)||''}</div></div>`; });
  }
  panel.innerHTML = html;
}

function renderStats(){
  const panel = document.getElementById('stats-panel');
  const vd = visibleData();
  const themes = {};
  vd.forEach(c=>{
    const t = c.theme && c.theme.trim() ? c.theme.trim() : 'Sans thème';
    themes[t] = themes[t] || {total:0, interview:0, positive:0};
    themes[t].total++;
    if(['entretien','positive'].includes(c.statut)) themes[t].interview++;
    if(c.statut==='positive') themes[t].positive++;
  });
  const keys = Object.keys(themes);
  let html = '<h2 class="serif" style="font-size:1.2rem;margin-bottom:14px;">Répartition du pipeline</h2>';
  html += '<div style="background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:22px;max-width:520px;"><canvas id="statChart" height="180"></canvas></div>';
  html += '<h2 class="serif" style="font-size:1.2rem;margin-bottom:14px;">Taux de conversion par thème</h2>';
  if(keys.length===0) html += '<div class="empty">Ajoute des candidatures avec un thème pour voir les statistiques.</div>';
  keys.sort((a,b)=>themes[b].total-themes[a].total).forEach(t=>{
    const s = themes[t];
    const pct = s.total ? Math.round(s.interview/s.total*100) : 0;
    html += `<div class="theme-stat"><h3>${esc(t)}</h3>
      <div class="figs">${s.total} candidature${s.total>1?'s':''} · ${s.interview} entretien${s.interview>1?'s':''} · ${s.positive} offre${s.positive>1?'s':''}</div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="figs">${pct}% mènent à un entretien</div></div>`;
  });
  panel.innerHTML = html;

  if(window.Chart){
    const counts = STATUTS.map(s=>vd.filter(d=>d.statut===s.key).length);
    const colors = ['#6B7280','#C6811C','#2E6AA8','#2E9552','#C85A41'];
    const ctx = document.getElementById('statChart');
    if(statChart) statChart.destroy();
    statChart = new Chart(ctx, {
      type:'bar',
      data:{ labels:STATUTS.map(s=>s.label), datasets:[{ data:counts, backgroundColor:colors, borderRadius:6 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
  }
}

function renderCompare(){
  const panel = document.getElementById('compare-panel');
  const offers = visibleData().filter(d=>d.statut==='positive');
  let html = '<h2 class="serif" style="font-size:1.2rem;margin-bottom:14px;">Comparer les offres reçues</h2>';
  if(offers.length===0){
    html += '<div class="empty">Pas encore d\'offre positive à comparer — ça viendra !</div>';
  } else {
    html += '<div style="overflow-x:auto;"><table class="compare"><tr><th>Entreprise</th><th>Thème</th><th>Ville</th><th>Durée</th><th>Rémunération</th><th>Missions</th></tr>';
    offers.forEach(c=>{ html += `<tr><td><b>${esc(c.entreprise)}</b></td><td>${esc(c.theme)||'—'}</td><td>${esc(c.ville)||'—'}</td><td>${esc(c.duree)||'—'}</td><td>${esc(c.remuneration)||'—'}</td><td>${esc(c.missions)||'—'}</td></tr>`; });
    html += '</table></div>';
  }
  panel.innerHTML = html;
}

function renderCities(){
  const panel = document.getElementById('cities-panel');
  const cities = {};
  visibleData().forEach(c=>{
    const v = c.ville && c.ville.trim() ? c.ville.trim() : 'Ville non précisée';
    cities[v] = cities[v] || [];
    cities[v].push(c);
  });
  const keys = Object.keys(cities);
  let html = '<h2 class="serif" style="font-size:1.2rem;margin-bottom:6px;">Candidatures par ville</h2>';
  html += '<div class="empty" style="margin-bottom:14px;">Vue groupée par ville.</div>';
  if(keys.length===0) html += '<div class="empty">Aucune ville renseignée pour l\'instant.</div>';
  keys.sort((a,b)=>cities[b].length-cities[a].length).forEach(v=>{
    html += `<div class="city-group"><h3>📍 ${esc(v)} <span style="color:var(--sub);font-size:.8rem;">(${cities[v].length})</span></h3><div class="chips">`;
    cities[v].forEach(c=>{ html += `<div class="city-chip"><b>${esc(c.entreprise)}</b>${c.theme?' — '+esc(c.theme):''}</div>`; });
    html += '</div></div>';
  });
  panel.innerHTML = html;
}

function renderAll(){ renderStatRow(); renderBoard(); renderCalendar(); renderStats(); renderCompare(); renderCities(); }

function celebrate(name){
  const el = document.getElementById('celebrate');
  const msg = document.getElementById('celebrateMsg');
  msg.textContent = `🎉 Bravo ! Réponse positive de ${name}`;
  el.querySelectorAll('.confetti').forEach(n=>n.remove());
  const emojis = ['🎉','✨','🎊','⭐'];
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.className='confetti'; s.textContent = emojis[i%emojis.length];
    s.style.left = (Math.random()*90+5)+'%';
    s.style.animationDelay = (Math.random()*.4)+'s';
    el.appendChild(s);
  }
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

function resetForm() {
  editingId = null;
  ['f-entreprise','f-theme','f-poste','f-ville','f-date','f-relance','f-dateEntretien','f-contact','f-lien','f-duree','f-remuneration','f-missions','f-notes','f-appris']
    .forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-statut').value='envoyee';
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab+'-panel').classList.add('active');
  });
});

document.getElementById('openForm').addEventListener('click', ()=>{ resetForm(); document.getElementById('form').classList.toggle('open'); });
document.getElementById('cancelBtn').addEventListener('click', ()=>{ document.getElementById('form').classList.remove('open'); resetForm(); });

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const entreprise = document.getElementById('f-entreprise').value.trim();
  if(!entreprise){ toast("Indique au moins le nom de l'entreprise."); return; }
  
  const formData = {
    entreprise, theme: document.getElementById('f-theme').value.trim(), poste: document.getElementById('f-poste').value.trim(),
    ville: document.getElementById('f-ville').value.trim(), date: document.getElementById('f-date').value,
    relance: document.getElementById('f-relance').value, dateEntretien: document.getElementById('f-dateEntretien').value,
    statut: document.getElementById('f-statut').value, contact: document.getElementById('f-contact').value.trim(),
    lien: document.getElementById('f-lien').value.trim(), duree: document.getElementById('f-duree').value.trim(),
    remuneration: document.getElementById('f-remuneration').value.trim(), missions: document.getElementById('f-missions').value.trim(),
    notes: document.getElementById('f-notes').value.trim(), appris: document.getElementById('f-appris').value.trim()
  };

  if(editingId) {
    const index = data.findIndex(d => d.id === editingId);
    if(index !== -1) {
      const wasPositive = data[index].statut === 'positive';
      data[index] = { ...data[index], ...formData };
      if(!wasPositive && data[index].statut === 'positive') celebrate(entreprise);
    }
  } else {
    data.push({ id: Date.now().toString(36), ...formData });
    if(formData.statut === 'positive') celebrate(entreprise);
  }
  
  persist(); resetForm(); document.getElementById('form').classList.remove('open'); renderAll();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if(data.length === 0) { toast("Aucune donnée à sauvegarder."); return; }
  const dataStr = JSON.stringify(data, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
  const linkElement = document.createElement('a');
  linkElement.setAttribute('href', dataUri);
  linkElement.setAttribute('download', 'suivi_candidatures_stage.json');
  linkElement.click();
  toast("Fichier téléchargé ✓");
});

document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const importedData = JSON.parse(e.target.result);
      if(Array.isArray(importedData)) {
        showConfirm("Remplacer vos données actuelles par celles du fichier importé ?", ()=>{
          data = importedData; persist(); renderAll(); toast("Importation réussie !");
        });
      } else { toast("Le format du fichier n'est pas valide."); }
    } catch(err) { toast("Erreur lors de la lecture du fichier JSON."); }
  };
  reader.readAsText(file); this.value = '';
});

document.addEventListener('keydown', e=>{
  const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if(e.key==='Escape'){ document.getElementById('form').classList.remove('open'); document.getElementById('confirmModal').classList.remove('show'); } 
  else if((e.key==='n' || e.key==='N') && !typing){ resetForm(); document.getElementById('form').classList.add('open'); document.getElementById('f-entreprise').focus(); }
});
</script>
</body>
</html>
